[package]
name = "witchcraft-metrics"
version = "1.0.1"
authors = ["Steven Fackler <sfackler@palantir.com>"]
edition = "2018"
license = "Apache-2.0"
description = "A general-purpose metrics library"
repository = "https://github.com/palantir/witchcraft-rust-logging"
categories = ["development-tools::profiling"]

[features]
js = ["dep:getrandom", "getrandom/wasm_js", "exponential-decay-histogram/js"]

[dependencies]
exponential-decay-histogram = "0.1.16"
once_cell = "1.0"
parking_lot = "0.12"
serde = "1.0"
serde-value = "0.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1.0"
getrandom = { version = "0.4", optional = true }

[dev-dependencies]
assert_approx_eq = "1.1"
wasm-bindgen-test = "0.3.77"
futures-timer =  { version = "3.0.4", features = ["wasm-bindgen"] }
