[package]
name = "witchcraft-log-util"
version = "2.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Utilities for Witchcraft logger implementations"
repository = "https://github.com/palantir/witchcraft-rust-logging"

[features]
# Enables the `trace` module, which looks up the load base of the enclosing native module.
address-offset = ["dep:findshlibs"]

[dependencies]
base64 = "0.23"
conjure-error = "5.0.0"
conjure-object = "5.0.0"
sequence_trie = "0.3.6"
serde = "1"
serde_json = "1"
witchcraft-log = { version = "5.0.0", path = "../witchcraft-log" }
witchcraft-logging-api = { version = "2.0.0", path = "../witchcraft-logging-api" }

# Used by `trace::find_address_offset` Gated off wasm, which findshlibs does not support
[target.'cfg(not(target_family = "wasm"))'.dependencies]
findshlibs = { version = "0.10", optional = true }
