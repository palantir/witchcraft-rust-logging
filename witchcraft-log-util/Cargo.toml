[package]
name = "witchcraft-log-util"
version = "2.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Utilities for Witchcraft logger implementations"
repository = "https://github.com/palantir/witchcraft-rust-logging"

[dependencies]
base64 = "0.23"
conjure-error = "5.0.0"
conjure-object = "5.0.0"
sequence_trie = "0.3.6"
serde = "1"
serde_json = "1"
witchcraft-log = { version = "5.0.0", path = "../witchcraft-log" }
witchcraft-logging-api = { version = "2.0.0", path = "../witchcraft-logging-api" }

# Used by `trace::find_address_offset` to locate the load base of the native module. Gated off wasm,
# which findshlibs does not support; `trace` degrades to a no-op there.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
findshlibs = "0.10"
